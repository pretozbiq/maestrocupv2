<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro Cup V2 - Bracket</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1115;
    color: #f5f5f5;
    min-height: 100vh;
  }
  header {
    padding: 24px 20px;
    text-align: center;
    background: linear-gradient(135deg, #1a1d29, #23283a);
    border-bottom: 1px solid #2c3140;
  }
  header h1 {
    margin: 0 0 6px 0;
    font-size: 1.6rem;
    letter-spacing: 0.5px;
  }
  header p {
    margin: 0;
    color: #9aa0ac;
    font-size: 0.95rem;
  }
  .container {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .bracket-wrapper {
    background: #ffffff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  iframe {
    display: block;
    border: none;
    width: 100%;
    height: 600px;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: #6b7280;
    font-size: 0.85rem;
  }
  footer a {
    color: #8fb3ff;
  }
</style>
</head>
<body>

<header>
  <h1>🏆 Maestro Cup V2</h1>
  <p>Suivez le bracket du tournoi en direct</p>
</header>

<div class="container">
  <div class="bracket-wrapper">
    <iframe src="https://challonge.com/fr/maestrocupv2/module" width="100%" height="600" frameborder="0" scrolling="auto" allowtransparency="true"></iframe>
  </div>
</div>

<footer>
  Propulsé par <a href="https://challonge.com/fr/maestrocupv2" target="_blank" rel="noopener">Challonge</a>
</footer>

</body>
</html>
